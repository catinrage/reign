		<!-- The loading screen: drawn with the page itself, before any of the game's code arrives. -->
		<style>
			#boot {
				position: fixed;
				inset: 0;
				z-index: 1000;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 30px;
				background: radial-gradient(ellipse at 50% 46%, #3a1f0e 0%, #1f110a 42%, #140b07 75%);
				transition: opacity 0.5s ease;
				user-select: none;
				overflow: hidden;
			}
			#boot.gone {
				opacity: 0;
				pointer-events: none;
			}
			#boot .logo {
				width: min(540px, 78vw);
				height: auto;
				image-rendering: pixelated;
				filter: drop-shadow(0 6px 0 #0a0503) drop-shadow(0 0 40px rgba(255, 176, 74, 0.25));
				animation: boot-bob 3.2s ease-in-out infinite;
			}
			#boot .track {
				width: min(408px, 76vw);
				padding: 3px;
				background: #0a0503;
				/* Notched pixel corners. */
				clip-path: polygon(
					3px 0,
					calc(100% - 3px) 0,
					100% 3px,
					100% calc(100% - 3px),
					calc(100% - 3px) 100%,
					3px 100%,
					0 calc(100% - 3px),
					0 3px
				);
				filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.35));
			}
			#boot .well {
				box-sizing: border-box;
				height: 30px;
				padding: 3px;
				background: #0d0603;
				/* Carved wood, lit from above. */
				border: 3px solid;
				border-color: #7d4b28 #4a2a16 #2e180b #4a2a16;
			}
			#boot .fill {
				width: 0;
				height: 100%;
				/* Gold blocks with a bright top row and a shaded bottom row. */
				background:
					linear-gradient(
						#fff2b0 0 3px,
						transparent 3px calc(100% - 3px),
						#b8740f calc(100% - 3px)
					),
					repeating-linear-gradient(90deg, #ffd45a 0 9px, #d8961a 9px 12px);
				box-shadow: 0 0 14px rgba(255, 196, 80, 0.45);
			}
			#boot .cap {
				min-height: 20px;
				color: #d2b894;
				font:
					500 17px 'Pixelify Sans',
					'Reign Px CJK',
					system-ui,
					sans-serif;
				letter-spacing: 0.04em;
				text-shadow: 0 2px 0 #0a0503;
				opacity: 0;
				transition: opacity 0.3s ease;
			}
			#boot .cap.on {
				opacity: 1;
			}
			#boot i {
				position: absolute;
				bottom: -12px;
				width: 6px;
				height: 6px;
				background: #ffb347;
				box-shadow: 0 0 8px #ff8a2a;
				animation: boot-ember 9s linear infinite;
				opacity: 0;
			}
			@keyframes boot-bob {
				50% {
					transform: translateY(-6px);
				}
			}
			@keyframes boot-ember {
				10% {
					opacity: 0.9;
				}
				80% {
					opacity: 0.5;
				}
				100% {
					transform: translate(40px, -105vh);
					opacity: 0;
				}
			}
			@media (max-width: 700px) {
				#boot {
					gap: 22px;
				}
				#boot .well {
					height: 24px;
				}
				#boot .cap {
					font-size: 14px;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#boot .logo,
				#boot i {
					animation: none;
				}
			}
		</style>
	</head>

		<script>
			// Drives the bar until the game's code takes over (src/client/boot.ts). Each loading step
			// sets the mark it has reached and the next one: the bar runs up to the first and then
			// creeps toward the second, so it keeps moving through a long download without ever
			// claiming a step that hasn't finished.
			(function () {
				var el = document.getElementById('boot');
				var well = el.querySelector('.well');
				var fill = el.querySelector('.fill');
				var cap = el.querySelector('.cap');
				var shown = 0,
					at = 0.06,
					next = 0.14,
					last = performance.now();
				var finish = null,
					finishFrom = 0,
					finishAt = 0;
				function frame(now) {
					// Time-based, so a slow frame rate (the room building behind) doesn't slow the bar.
					var dt = Math.min(0.25, (now - last) / 1000);
					last = now;
					if (finish) shown = finishFrom + (1 - finishFrom) * Math.min(1, (now - finishAt) / 350);
					else if (shown < at)
						shown = Math.min(
							at,
							shown + Math.max((at - shown) * (1 - Math.exp(-dt * 9)), dt * 0.12)
						);
					else shown += (next - shown) * (1 - Math.exp(-dt * 0.35));
					// Whole gold blocks only, like the pixel art around it.
					var inner = well.clientWidth - 6;
					var blocks = Math.floor((inner + 3) / 12);
					fill.style.width = Math.min(inner, Math.round(shown * blocks) * 12) + 'px';
					if (finish && shown >= 1) return finish();
					requestAnimationFrame(frame);
				}
				window.__boot = {
					step: function (reached, upTo, label) {
						at = Math.max(at, reached);
						next = Math.max(next, upTo, at);
						el.setAttribute('aria-valuenow', String(Math.round(at * 100)));
						if (label) {
							cap.textContent = label;
							cap.classList.add('on');
						}
					},
					label: function (aria) {
						el.setAttribute('aria-label', aria);
					},
					done: function () {
						if (finish) return;
						at = next = 1;
						el.setAttribute('aria-valuenow', '100');
						finishFrom = shown;
						finishAt = performance.now();
						finish = function () {
							el.classList.add('gone');
							setTimeout(function () {
								el.remove();
							}, 600);
						};
					}
				};
				requestAnimationFrame(frame);
			})();
		</script>

		<div id="app"></div>
		<script type="module" src="/main.ts"></script>
