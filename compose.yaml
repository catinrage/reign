# `docker compose up -d --build` runs the game on http://localhost:8787 (set PORT to change it).
# `docker compose --profile dev up --build` runs the dev setup instead: Vite with hot reload on
# http://localhost:5173 and the game server with dev cheats on, both from your working copy.
# Add -V after changing dependencies so the container gets fresh node_modules.
# Accounts, friends and match history live in the `db` Postgres service, kept in the `db` volume.
# On a server with a domain, `docker compose --profile https up -d --build` also starts Caddy on
# ports 80 and 443 with a free Let's Encrypt certificate for DOMAIN. Settings go in .env (see
# .env.example).

x-database: &database
  DATABASE_URL: postgres://reign:${POSTGRES_PASSWORD:-reign}@db:5432/reign

services:
  reign:
    build: .
    image: reign
    ports:
      - '${BIND:-0.0.0.0}:${PORT:-8787}:8787'
    environment: *database
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: reign
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reign}
      POSTGRES_DB: reign
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reign -d reign']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  dev:
    profiles: [dev]
    build:
      context: .
      target: deps
    command: pnpm dev
    init: true
    ports:
      - '5173:5173'
    environment: *database
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

  caddy:
    profiles: [https]
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - reign
    restart: unless-stopped

volumes:
  db:
  caddy_data:
  caddy_config:
